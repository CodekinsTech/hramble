<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>God vs Devil</title>
  <style>
    body { margin: 0; height: 100vh; display: flex; }
    .container { width: 50%; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; font-family: Arial, sans-serif; }
    .left { background: white; color: black; }
    .right { background: black; color: white; }
    h1 { font-size: 48px; margin: 0; }
    svg { width: 120px; height: 120px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="container left">
    <h1>God</h1>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <path d="M3 12h18M12 3v18"/>
    </svg>
  </div>
  <div class="container right">
    <h1>Devil</h1>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <path d="M12 4l-8 8h4l-2 8 8-8h4l-2-8Z"/>
    </svg>
  </div>
</body>
</html>
