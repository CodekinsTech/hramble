<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hramble — Live Share</title>
<style>
	:root { color-scheme: dark; }
	* { box-sizing: border-box; }
	body {
		margin: 0;
		font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
		background: #0b0b0d;
		color: #e7e7ea;
		height: 100vh;
		display: flex;
		flex-direction: column;
	}
	header {
		display: flex;
		align-items: center;
		justify-content: space-between;
		padding: 12px 16px;
		border-bottom: 1px solid #232326;
		flex-shrink: 0;
	}
	header h1 { font-size: 14px; font-weight: 600; margin: 0; }
	#status { font-size: 12px; color: #8a8a92; display: flex; align-items: center; gap: 6px; }
	#status .dot { width: 7px; height: 7px; border-radius: 50%; background: #8a8a92; }
	#status.connected .dot { background: #3fcf6e; }
	#status.disconnected .dot { background: #e5484d; }
	#status.waiting .dot { background: #f5a623; }
	#screen {
		display: none;
		flex-shrink: 0;
		height: 42vh;
		border-bottom: 1px solid #232326;
		background: #000;
		position: relative;
	}
	#screen.visible { display: block; }
	#screen iframe, #screen img {
		width: 100%;
		height: 100%;
		border: 0;
		object-fit: contain;
		display: block;
	}
	#feed {
		flex: 1;
		overflow-y: auto;
		padding: 16px;
		display: flex;
		flex-direction: column;
		gap: 10px;
		min-height: 0;
	}
	.event {
		max-width: 640px;
		font-size: 13px;
		line-height: 1.5;
		padding: 8px 12px;
		border-radius: 8px;
		background: #17171a;
		border: 1px solid #232326;
		white-space: pre-wrap;
		word-break: break-word;
	}
	.event .role { color: #8a8a92; font-size: 11px; display: block; margin-bottom: 3px; }
	#empty { color: #6b6b72; font-size: 13px; padding: 16px; }
	footer {
		display: flex;
		gap: 8px;
		padding: 12px 16px;
		border-top: 1px solid #232326;
		flex-shrink: 0;
	}
	footer input {
		flex: 1;
		background: #17171a;
		border: 1px solid #232326;
		border-radius: 8px;
		padding: 9px 12px;
		color: inherit;
		font-size: 13px;
		outline: none;
	}
	footer input:focus { border-color: #3a3a40; }
	footer button {
		background: #e7e7ea;
		color: #0b0b0d;
		border: none;
		border-radius: 8px;
		padding: 9px 16px;
		font-size: 13px;
		font-weight: 600;
		cursor: pointer;
	}
	footer button:disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>
	<header>
		<h1>Hramble — Live Share</h1>
		<div id="status" class="disconnected"><span class="dot"></span><span id="status-text">Connecting…</span></div>
	</header>
	<div id="screen"></div>
	<div id="feed"><div id="empty">No messages yet — type below to send the first one.</div></div>
	<footer>
		<input id="composer" type="text" placeholder="Send a message into the session…" disabled />
		<button id="send" disabled>Send</button>
	</footer>

<script>
(function () {
	const room = new URLSearchParams(location.search).get("room") || location.pathname.split("/").filter(Boolean).pop()
	const feed = document.getElementById("feed")
	const empty = document.getElementById("empty")
	const screen = document.getElementById("screen")
	const statusEl = document.getElementById("status")
	const statusText = document.getElementById("status-text")
	const composer = document.getElementById("composer")
	const sendBtn = document.getElementById("send")

	if (!room) {
		statusText.textContent = "No share link — check the URL"
		return
	}

	// Two independent facts: are we connected to the relay at all, and — separately —
	// is the Hramble desktop app actually there to act on anything. "Live" only
	// when both are true; otherwise say plainly which one isn't.
	let relayConnected = false
	let hostConnected = false

	function updateStatus() {
		if (!relayConnected) {
			statusEl.className = "disconnected"
			statusText.textContent = "Reconnecting…"
		} else if (!hostConnected) {
			statusEl.className = "waiting"
			statusText.textContent = "Desktop app not running"
		} else {
			statusEl.className = "connected"
			statusText.textContent = "Live"
		}
		composer.disabled = !relayConnected
		sendBtn.disabled = !relayConnected
	}

	function addEvent(role, text) {
		const el = document.createElement("div")
		el.className = "event"
		const roleLabel = document.createElement("span")
		roleLabel.className = "role"
		roleLabel.textContent = role
		el.appendChild(roleLabel)
		el.appendChild(document.createTextNode(text))
		feed.appendChild(el)
	}

	/** A snapshot is the full, current event list — re-render the feed to match it exactly, not append. */
	function renderSnapshot(events) {
		feed.innerHTML = ""
		if (!Array.isArray(events) || events.length === 0) {
			feed.appendChild(empty)
			return
		}
		for (const e of events) addEvent(e.role || "session", e.text ?? "")
		feed.scrollTop = feed.scrollHeight
	}

	/**
	 * "html" (an artifact — self-contained by convention) runs live in a
	 * sandboxed frame, so animations/3D/interactivity work here exactly as on
	 * the desktop. "url" loads the same address directly. "screenshot" is the
	 * fallback for anything local-only the phone can't reach on its own.
	 */
	function renderScreen(content) {
		screen.innerHTML = ""
		if (!content) {
			screen.classList.remove("visible")
			return
		}
		screen.classList.add("visible")
		if (content.kind === "html" && typeof content.html === "string") {
			const iframe = document.createElement("iframe")
			iframe.setAttribute("sandbox", "allow-scripts")
			iframe.srcdoc = content.html
			screen.appendChild(iframe)
		} else if (content.kind === "url" && typeof content.url === "string") {
			const iframe = document.createElement("iframe")
			iframe.setAttribute("sandbox", "allow-scripts allow-same-origin allow-forms allow-popups")
			iframe.src = content.url
			screen.appendChild(iframe)
		} else if (content.kind === "screenshot" && typeof content.dataUrl === "string") {
			const img = document.createElement("img")
			img.alt = "Live view of the browser pane"
			img.src = content.dataUrl
			screen.appendChild(img)
		} else {
			screen.classList.remove("visible")
		}
	}

	let ws
	function connect() {
		const proto = location.protocol === "https:" ? "wss:" : "ws:"
		ws = new WebSocket(`${proto}//${location.host}/parties/session-room/${encodeURIComponent(room)}?role=viewer`)
		ws.onopen = () => {
			relayConnected = true
			updateStatus()
		}
		ws.onclose = () => {
			relayConnected = false
			hostConnected = false
			updateStatus()
			setTimeout(connect, 2000)
		}
		ws.onerror = () => ws.close()
		ws.onmessage = (event) => {
			let msg
			try {
				msg = JSON.parse(event.data)
			} catch {
				return
			}
			if (msg.type === "presence") {
				hostConnected = !!msg.hostConnected
				updateStatus()
				return
			}
			if (msg.type === "no-host") {
				addEvent("session", "Hramble isn't running right now — open the desktop app, then try again.")
				feed.scrollTop = feed.scrollHeight
				return
			}
			if (msg.type === "snapshot") renderSnapshot(msg.state)
			if (msg.type === "screen") renderScreen(msg.content)
		}
	}
	connect()

	function send() {
		const text = composer.value.trim()
		if (!text || !ws || ws.readyState !== WebSocket.OPEN) return
		ws.send(JSON.stringify({ type: "viewer-message", text }))
		composer.value = ""
	}
	sendBtn.addEventListener("click", send)
	composer.addEventListener("keydown", (e) => {
		if (e.key === "Enter") send()
	})
})()
</script>
</body>
</html>
